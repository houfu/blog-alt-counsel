<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Beeswarm schematic</title>
  <desc id="desc">A simplified schematic of the lawyer-coder beeswarm against a deep purple background. A wedge with most dots clustered at the wide base in blue (LegalQuants), one green dot mixed in (LawyersOnGitHub outlier), a thin middle band, and one or two dots near the narrow apex in amber (active veterans) and green. A rotated y-axis caption on the left reads "External merged PRs per year".</desc>

  <!-- Background -->
  <rect width="400" height="400" fill="#330066"/>

  <!-- Wedge plot frame (trapezoid) — light purple tint so dots stay readable -->
  <polygon points="50,350 350,350 220,60 180,60" fill="#F2E5F2" stroke="#8A4FB8" stroke-width="1"/>

  <!-- Two faint horizontal reference lines (subtle on the light purple wedge) -->
  <line x1="80"  y1="270" x2="320" y2="270" stroke="#D2B8DD" stroke-width="0.8"/>
  <line x1="155" y1="170" x2="245" y2="170" stroke="#D2B8DD" stroke-width="0.8"/>

  <!-- Y-axis caption — rotated, white italic, left of wedge -->
  <g transform="translate(28, 205) rotate(-90)">
    <text x="0" y="0" text-anchor="middle" font-family="'Concourse OT Italics', Georgia, serif" font-style="italic" font-size="13" fill="#F0E5F8">External merged PRs per year</text>
  </g>

  <!-- Bottom carpet: 7 blue (LegalQuants) + 1 green (LawyersOnGitHub outlier) -->
  <circle cx="72"  cy="345" r="7" fill="#2D4A7C" opacity="0.85"/>
  <circle cx="108" cy="345" r="7" fill="#2D4A7C" opacity="0.85"/>
  <circle cx="144" cy="345" r="7" fill="#2D4A7C" opacity="0.85"/>
  <circle cx="180" cy="345" r="7" fill="#6B8B5C" opacity="0.85"/>
  <circle cx="216" cy="345" r="7" fill="#2D4A7C" opacity="0.85"/>
  <circle cx="252" cy="345" r="7" fill="#2D4A7C" opacity="0.85"/>
  <circle cx="288" cy="345" r="7" fill="#2D4A7C" opacity="0.85"/>
  <circle cx="324" cy="345" r="7" fill="#2D4A7C" opacity="0.85"/>

  <!-- Just above carpet: 2 dots (1 blue, 1 green) -->
  <circle cx="148" cy="305" r="6" fill="#2D4A7C" opacity="0.85"/>
  <circle cx="252" cy="305" r="6" fill="#6B8B5C" opacity="0.85"/>

  <!-- Middle zone: 2 green dots -->
  <circle cx="162" cy="225" r="6" fill="#6B8B5C" opacity="0.85"/>
  <circle cx="238" cy="225" r="6" fill="#6B8B5C" opacity="0.85"/>

  <!-- Upper zone: 1 green dot -->
  <circle cx="200" cy="150" r="6" fill="#6B8B5C" opacity="0.85"/>

  <!-- Apex: 1 amber + 1 green -->
  <circle cx="186" cy="90" r="6" fill="#B8924C" opacity="0.9"/>
  <circle cx="214" cy="90" r="6" fill="#6B8B5C" opacity="0.85"/>
</svg>
