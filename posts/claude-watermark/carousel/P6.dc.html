<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>

<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1a6aa8; } a:hover { color: #10456c; }
    .pg { width: 1080px; height: 1350px; background: #FFFFFF; box-sizing: border-box; padding: 84px; display: flex; flex-direction: column; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; color: #000000; }
    .mark { display: flex; align-items: center; gap: 18px; }
    .markcap { background: #F4F3EF; border: 3px solid #000000; border-radius: 8px; padding: 8px 14px; font-family: 'Archivo Black', 'Arial Black', sans-serif; font-size: 26px; line-height: 1; }
    .markword { font-family: 'Archivo Black', 'Arial Black', sans-serif; font-size: 30px; letter-spacing: 9px; }
    .body-mid { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
    .foot { display: flex; justify-content: space-between; align-items: flex-end; font-size: 24px; color: #6F6C66; }
    .h1 { font-family: 'Archivo Black', 'Arial Black', sans-serif; font-size: 78px; line-height: 1.05; letter-spacing: -2px; margin: 0; }
    .h2 { font-family: 'Archivo Black', 'Arial Black', sans-serif; font-size: 86px; line-height: 1.06; letter-spacing: -2px; margin: 0; }
    .sentence { font-family: 'Archivo Black', 'Arial Black', sans-serif; font-size: 52px; line-height: 1.18; margin: 0; }
    .lede { font-size: 42px; line-height: 1.36; margin: 0; color: #3a3a38; }
    .note { font-size: 30px; line-height: 1.4; color: #6F6C66; margin: 0; }
    .eyebrow { font-size: 25px; letter-spacing: 4px; font-weight: 600; color: #6F6C66; text-transform: uppercase; margin: 0; }
    .keyrow { display: flex; gap: 28px; align-items: flex-start; }
    .kw { position: relative; }
    .ks { position: absolute; left: 0; top: 18px; width: 100%; height: 100%; background: #8AC0DD; border: 4px solid #000000; border-radius: 18px; box-sizing: border-box; }
    .kf { position: relative; background: #BBDDFF; border: 4px solid #000000; border-radius: 18px; box-sizing: border-box; padding: 28px 34px; font-family: 'Archivo Black', 'Arial Black', sans-serif; font-size: 42px; line-height: 1; }
    .kw-down { position: relative; padding-top: 14px; }
    .ks-down { position: absolute; left: 0; top: 18px; right: 0; bottom: 14px; background: #6F6C66; border: 4px solid #000000; border-radius: 18px; box-sizing: border-box; }
    .kf-down { position: relative; background: #9B9A8F; border: 4px solid #000000; border-radius: 18px; box-sizing: border-box; padding: 28px 34px; font-family: 'Archivo Black', 'Arial Black', sans-serif; font-size: 42px; line-height: 1; }
  </style>
</helmet>
<div class="pg">
  <div class="mark"><span class="markcap">ALT+</span><span class="markword">COUNSEL</span></div>
  <div class="body-mid" style="gap: 50px;">
    <p class="eyebrow">&ldquo;Equally good&rdquo; means equally good to the model</p>
    <div style="display: flex; flex-direction: column; gap: 24px; font-family: 'Archivo Black', 'Arial Black', sans-serif; font-size: 46px; line-height: 1.15;">
      <div>condition &ne; warranty</div>
      <div>guarantee &ne; indemnity</div>
      <div>terminate &ne; rescind</div>
    </div>
    <div style="height: 6px; background: #000000; width: 100%;"></div>
    <p class="lede" style="color: #000000;">The model ranks probability.<br>The lawyer makes a judgement.</p>
  </div>
  <div class="foot"><span>alt-counsel.com</span><span>6 / 8</span></div>
</div>
</x-dc>
